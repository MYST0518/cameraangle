<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>AI VIDEO PROMPT <span class="highlight">GENERATOR</span></h1>
            <p>Create dynamic, professional prompts for VIDU, SEEDREAM, and KLING.</p>

            <div class="mode-toggle-container">
                <button id="mode-simple" class="mode-btn active">Simple Mode</button>
                <button id="mode-advanced" class="mode-btn">Advanced Mode</button>
            </div>
        </header>

        <main>
            <!-- SIMPLE MODE -->
            <div id="simple-builder" class="builder-section">
                <div class="control-group">
                    <label for="platform">Platform</label>
                    <select id="platform" class="select-input">
                        <option value="generic">Generic (All Tools)</option>
                        <option value="vidu">VIDU</option>
                        <option value="kling">KLING</option>
                        <option value="seedream">SEEDREAM</option>
                        <option value="luma">Luma Dream Machine</option>
                    </select>
                </div>

                <!-- Subject Section -->
                <div class="control-group">
                    <label for="subject">1. Subject & Action</label>
                    <input type="text" id="subject" placeholder="e.g., Rock band performing live, guitarist solo..."
                        value="Rock band performing live">
                </div>

                <!-- Negative Prompt Section -->
                <div class="control-group">
                    <label for="negative-prompt">Negative Prompt (Avoid)</label>
                    <input type="text" id="negative-prompt" placeholder="e.g., blurry, distorted, text, watermark...">
                </div>

                <!-- typical Scenes Section -->
                <div class="control-group">
                    <label>2. Typical Scenes (Subject Presets)</label>
                    <div id="scenes-container" class="scenes-grid">
                        <!-- Categories and Options injected by JS -->
                    </div>
                </div>

                <!-- Camera Angle Section -->
                <div class="control-group">
                    <label>3. Camera Angle</label>
                    <div class="options-grid" id="angle-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Camera Movement Section -->
                <div class="control-group">
                    <label>4. Camera Movement</label>
                    <div class="options-grid" id="movement-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Visual Style Section -->
                <div class="control-group">
                    <label>5. Visual Style & Effects</label>
                    <div class="options-grid" id="style-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>
            </div>

            <!-- ADVANCED MODE -->
            <div id="advanced-builder" class="builder-section hidden">
                <div class="manual-guide">
                    <p><strong>Scene Decomposition:</strong> Break down your prompt into structured elements for better
                        control (Hailuo 02/Vidu recommended).</p>
                </div>

                <div class="control-group">
                    <label for="adv-shot">1. Shot / Scale (画角)</label>
                    <select id="adv-shot" class="select-input">
                        <option value="">Select Shot Scale</option>
                        <option value="Extreme Close-Up">Extreme Close-Up (目や指先など)</option>
                        <option value="Close-Up">Close-Up (顔アップ)</option>
                        <option value="Medium Shot">Medium Shot (腰から上)</option>
                        <option value="Full Shot">Full Shot (全身)</option>
                        <option value="Wide Shot">Wide Shot (周囲の風景含む)</option>
                        <option value="Establish Shot">Establish Shot (状況説明用の引き画)</option>
                        <option value="Bird's Eye View">Bird's Eye View (俯瞰)</option>
                        <option value="Worm's Eye View">Worm's Eye View (あおり)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-action">2. Action / Description (行動・内容)</label>
                    <select id="adv-action" class="select-input">
                        <option value="">Select Rock Festival Scene</option>

                        <!-- Vocal Performance -->
                        <optgroup label="🎤 Vocal Performance">
                            <option value="Lead vocalist screaming into the microphone with intense emotion">Lead
                                vocalist screaming (激しく叫ぶ)</option>
                            <option value="Singer reaching out to the crowd with outstretched arms">Singer reaching to
                                crowd (観客に手を伸ばす)</option>
                            <option value="Frontman jumping off the drum riser">Frontman jumping off riser (演台から飛び降り)
                            </option>
                            <option value="Vocalist on knees, singing with eyes closed">Vocalist on knees (ひざまずいて歌う)
                            </option>
                            <option value="Singer swinging the microphone stand dramatically">Swinging microphone stand
                                (マイクスタンドを振り回す)</option>
                            <option value="Lead singer doing crowd surfing">Vocalist crowd surfing (クラウドサーフィン)</option>
                            <option value="Singer walking through the audience">Walking through audience (観客の中を歩く)
                            </option>
                        </optgroup>

                        <!-- Instrument Performance -->
                        <optgroup label="🎸 Guitar & Bass">
                            <option value="Guitarist shredding an intense solo">Guitar solo shredding (激しいギターソロ)
                            </option>
                            <option value="Bassist headbanging while playing">Bassist headbanging (ヘッドバンギング)</option>
                            <option value="Guitarist holding the guitar high above head">Guitar raised high (ギターを高く掲げる)
                            </option>
                            <option value="Dual guitar attack facing each other">Dual guitar attack (ツインギター)</option>
                            <option value="Guitarist smashing the guitar on stage">Smashing guitar (ギターを破壊)</option>
                            <option value="Bassist sliding across the stage floor">Bass slide (床を滑る)</option>
                            <option value="Guitarist playing behind the head">Playing behind head (頭の後ろで演奏)</option>
                        </optgroup>

                        <optgroup label="🥁 Drums">
                            <option value="Drummer performing a powerful drum solo">Powerful drum solo (ドラムソロ)</option>
                            <option value="Drummer throwing sticks into the crowd">Throwing drum sticks (スティックを投げる)
                            </option>
                            <option value="Drummer standing and playing intensely">Standing drum performance (立ち上がって演奏)
                            </option>
                            <option value="Drummer with sweat flying everywhere">Sweat flying (汗が飛び散る)</option>
                        </optgroup>

                        <!-- Band Interaction -->
                        <optgroup label="👥 Band Interaction">
                            <option value="All band members jumping in sync">Synchronized jump (全員でジャンプ)</option>
                            <option value="Members facing each other playing intensely">Members facing off (メンバー同士が向き合う)
                            </option>
                            <option value="Band huddled together on stage">Band huddle (メンバーが寄り集まる)</option>
                            <option value="Guitarist and bassist back to back">Back to back pose (背中合わせ)</option>
                            <option value="Band members introducing each other">Member introductions (メンバー紹介)</option>
                        </optgroup>

                        <!-- Crowd Interaction -->
                        <optgroup label="🙌 Crowd Interaction">
                            <option value="Entire crowd singing the chorus together">Crowd sing-along (大合唱)</option>
                            <option value="Wall of death forming in the crowd">Wall of death (ウォールオブデス)</option>
                            <option value="Circle pit spinning wildly">Circle pit (サークルピット)</option>
                            <option value="Mosh pit exploding with energy">Explosive mosh pit (激しいモッシュピット)</option>
                            <option value="Crowd raising fists to the sky">Fists in the air (拳を突き上げる)</option>
                            <option value="Wave of hands swaying to the music">Sea of hands swaying (手を揺らす観客の波)</option>
                            <option value="Crowd surfing over the sea of people">Crowd surfing (クラウドサーフィン)</option>
                            <option value="Fans holding up lighters and phones">Lighters up (ライター・スマホを掲げる)</option>
                        </optgroup>

                        <!-- Stage Production -->
                        <optgroup label="🎆 Stage Effects">
                            <option value="Pyrotechnics exploding behind the band">Pyrotechnics explosion (花火の演出)
                            </option>
                            <option value="Smoke machines filling the stage">Smoke filling stage (スモークが充満)</option>
                            <option value="Confetti cannons firing over the crowd">Confetti cannons (紙吹雪)</option>
                            <option value="Flames shooting up from the stage">Stage flames (炎が上がる)</option>
                            <option value="Strobe lights flashing rapidly">Strobe light chaos (フラッシュライト)</option>
                            <option value="Spotlights cutting through the darkness">Dramatic spotlights (スポットライト)
                            </option>
                            <option value="Laser beams sweeping across the venue">Laser light show (レーザー演出)</option>
                        </optgroup>

                        <!-- Special Moments -->
                        <optgroup label="⭐ Special Moments">
                            <option value="Encore performance with everyone on stage">Encore performance (アンコール)
                            </option>
                            <option value="Acoustic moment under a single spotlight">Acoustic moment (アコースティックタイム)
                            </option>
                            <option value="MC talking to the crowd">MC talking (MCタイム)</option>
                            <option value="Band members taking a bow together">Final bow (最後のお辞儀)</option>
                            <option value="Throwing picks and setlists into crowd">Throwing memorabilia (記念品を投げる)
                            </option>
                            <option value="Surprise guest joining on stage">Surprise guest appearance (サプライズゲスト)
                            </option>
                            <option value="Rain pouring down on outdoor festival">Rain at outdoor fest (野外フェスの雨)
                            </option>
                            <option value="Sunset silhouette during golden hour">Sunset silhouette (夕暮れのシルエット)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-camera">3. Camera Work (カメラワーク)</label>
                    <select id="adv-camera" class="select-input">
                        <option value="">Select Camera Movement</option>
                        <option value="Fixed/Static">Fixed / Static (固定)</option>
                        <option value="Handheld">Handheld (手持ち・手ブレ)</option>
                        <option value="Dolly In">Dolly In (寄り)</option>
                        <option value="Dolly Out">Dolly Out (引き)</option>
                        <option value="Tracking Shot">Tracking Shot (追従)</option>
                        <option value="Pan Right">Pan Right (右へ)</option>
                        <option value="Pan Left">Pan Left (左へ)</option>
                        <option value="Arc Shot">Arc Shot (回り込み)</option>
                        <option value="Crane Shot">Crane Shot (クレーン)</option>
                        <option value="FPV">FPV (一人称視点)</option>
                        <option value="Dutch Angle">Dutch Angle (斜め)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-lighting">4. Lighting / Mood (照明・雰囲気)</label>
                    <select id="adv-lighting" class="select-input">
                        <option value="">Select Lighting/Mood</option>
                        <option value="Cinematic lighting">Cinematic lighting (映画的照明)</option>
                        <option value="Natural sunlight">Natural sunlight (自然光)</option>
                        <option value="Golden hour">Golden hour (夕暮れ・朝日)</option>
                        <option value="Blue hour">Blue hour (薄暮・青い時間帯)</option>
                        <option value="Backlighting">Backlighting (逆光)</option>
                        <option value="Neon lights">Neon lights (ネオン照明)</option>
                        <option value="Volumetric fog">Volumetric fog (霧・光の筋)</option>
                        <option value="Harsh shadows">Harsh shadows (強い影)</option>
                        <option value="Soft diffuse light">Soft diffuse light (柔らかい光)</option>
                        <option value="Dramatic rim lighting">Dramatic rim lighting (リムライト)</option>
                        <option value="Low-key lighting">Low-key lighting (暗め・シャドウ多)</option>
                        <option value="High-key lighting">High-key lighting (明るめ・影少)</option>
                        <option value="Moody atmosphere">Moody atmosphere (ムーディー)</option>
                        <option value="Cyberpunk neon glow">Cyberpunk neon glow (サイバーパンク)</option>
                        <option value="Studio lighting">Studio lighting (スタジオ照明)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-format">Output Format</label>
                    <select id="adv-format" class="select-input">
                        <option value="standard">Standard: (shot), (action), (camera), (light)</option>
                        <option value="structured">Structured: [Shot: ...], [Action: ...]</option>
                        <option value="narrative">Narrative: A ... shot of ... with ... camera.</option>
                    </select>
                </div>
            </div>

            <div class="preview-section">
                <h2>Generated Prompt</h2>
                <div class="prompt-display">
                    <textarea id="final-prompt" readonly></textarea>
                    <div class="actions">
                        <button id="copy-btn" class="btn primary">
                            <span class="icon">📋</span> Copy to Clipboard
                        </button>
                        <button id="clear-btn" class="btn secondary">
                            <span class="icon">↺</span> Reset
                        </button>
                    </div>
                </div>
                <div id="copy-message" class="toast">Copied!</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
