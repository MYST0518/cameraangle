<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>AI VIDEO PROMPT <span class="highlight">GENERATOR</span></h1>
            <p>Create dynamic, professional prompts for VIDU, SEEDREAM, and KLING.</p>

            <div class="mode-toggle-container">
                <button id="mode-simple" class="mode-btn active">Simple Mode</button>
                <button id="mode-advanced" class="mode-btn">Advanced Mode</button>
            </div>
        </header>

        <main>
            <!-- SIMPLE MODE -->
            <div id="simple-builder" class="builder-section">
                <div class="control-group">
                    <label for="platform">Platform</label>
                    <select id="platform" class="select-input">
                        <option value="generic">Generic (All Tools)</option>
                        <option value="vidu">VIDU</option>
                        <option value="kling">KLING</option>
                        <option value="seedream">SEEDREAM</option>
                        <option value="luma">Luma Dream Machine</option>
                    </select>
                </div>

                <!-- Subject Section -->
                <div class="control-group">
                    <label for="subject">1. Subject & Action</label>
                    <input type="text" id="subject" placeholder="e.g., Rock band performing live, guitarist solo..."
                        value="Rock band performing live">
                </div>

                <!-- Negative Prompt Section -->
                <div class="control-group">
                    <label for="negative-prompt">Negative Prompt (Avoid)</label>
                    <input type="text" id="negative-prompt" placeholder="e.g., blurry, distorted, text, watermark...">
                </div>

                <!-- typical Scenes Section -->
                <div class="control-group">
                    <label>2. Typical Scenes (Subject Presets)</label>
                    <div id="scenes-container" class="scenes-grid">
                        <!-- Categories and Options injected by JS -->
                    </div>
                </div>

                <!-- Camera Angle Section -->
                <div class="control-group">
                    <label>3. Camera Angle</label>
                    <div class="options-grid" id="angle-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Camera Movement Section -->
                <div class="control-group">
                    <label>4. Camera Movement</label>
                    <div class="options-grid" id="movement-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Visual Style Section -->
                <div class="control-group">
                    <label>5. Visual Style & Effects</label>
                    <div class="options-grid" id="style-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>
            </div>

            <!-- ADVANCED MODE -->
            <div id="advanced-builder" class="builder-section hidden">
                <div class="manual-guide">
                    <p><strong>Scene Decomposition:</strong> Break down your prompt into structured elements for better
                        control (Hailuo 02/Vidu recommended).</p>
                </div>

                <div class="control-group">
                    <label for="adv-shot">1. Shot / Scale (画角)</label>
                    <select id="adv-shot" class="select-input">
                        <option value="">Select Shot Scale</option>
                        <option value="Extreme Close-Up">Extreme Close-Up (目や指先など)</option>
                        <option value="Close-Up">Close-Up (顔アップ)</option>
                        <option value="Medium Shot">Medium Shot (腰から上)</option>
                        <option value="Full Shot">Full Shot (全身)</option>
                        <option value="Wide Shot">Wide Shot (周囲の風景含む)</option>
                        <option value="Establish Shot">Establish Shot (状況説明用の引き画)</option>
                        <option value="Bird's Eye View">Bird's Eye View (俯瞰)</option>
                        <option value="Worm's Eye View">Worm's Eye View (あおり)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-action">2. Action / Description (行動・内容)</label>
                    <textarea id="adv-action" class="text-area-input"
                        placeholder="Example: A girl running through neon streets, looking back in fear..."></textarea>
                </div>

                <div class="control-group">
                    <label for="adv-camera">3. Camera Work (カメラワーク)</label>
                    <select id="adv-camera" class="select-input">
                        <option value="">Select Camera Movement</option>
                        <option value="Fixed/Static">Fixed / Static (固定)</option>
                        <option value="Handheld">Handheld (手持ち・手ブレ)</option>
                        <option value="Dolly In">Dolly In (寄り)</option>
                        <option value="Dolly Out">Dolly Out (引き)</option>
                        <option value="Tracking Shot">Tracking Shot (追従)</option>
                        <option value="Pan Right">Pan Right (右へ)</option>
                        <option value="Pan Left">Pan Left (左へ)</option>
                        <option value="Arc Shot">Arc Shot (回り込み)</option>
                        <option value="Crane Shot">Crane Shot (クレーン)</option>
                        <option value="FPV">FPV (一人称視点)</option>
                        <option value="Dutch Angle">Dutch Angle (斜め)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-lighting">4. Lighting / Mood (照明・雰囲気)</label>
                    <select id="adv-lighting" class="select-input">
                        <option value="">Select Lighting/Mood</option>
                        <option value="Cinematic lighting">Cinematic lighting (映画的照明)</option>
                        <option value="Natural sunlight">Natural sunlight (自然光)</option>
                        <option value="Golden hour">Golden hour (夕暮れ・朝日)</option>
                        <option value="Blue hour">Blue hour (薄暮・青い時間帯)</option>
                        <option value="Backlighting">Backlighting (逆光)</option>
                        <option value="Neon lights">Neon lights (ネオン照明)</option>
                        <option value="Volumetric fog">Volumetric fog (霧・光の筋)</option>
                        <option value="Harsh shadows">Harsh shadows (強い影)</option>
                        <option value="Soft diffuse light">Soft diffuse light (柔らかい光)</option>
                        <option value="Dramatic rim lighting">Dramatic rim lighting (リムライト)</option>
                        <option value="Low-key lighting">Low-key lighting (暗め・シャドウ多)</option>
                        <option value="High-key lighting">High-key lighting (明るめ・影少)</option>
                        <option value="Moody atmosphere">Moody atmosphere (ムーディー)</option>
                        <option value="Cyberpunk neon glow">Cyberpunk neon glow (サイバーパンク)</option>
                        <option value="Studio lighting">Studio lighting (スタジオ照明)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="adv-format">Output Format</label>
                    <select id="adv-format" class="select-input">
                        <option value="standard">Standard: (shot), (action), (camera), (light)</option>
                        <option value="structured">Structured: [Shot: ...], [Action: ...]</option>
                        <option value="narrative">Narrative: A ... shot of ... with ... camera.</option>
                    </select>
                </div>
            </div>

            <div class="preview-section">
                <h2>Generated Prompt</h2>
                <div class="prompt-display">
                    <textarea id="final-prompt" readonly></textarea>
                    <div class="actions">
                        <button id="copy-btn" class="btn primary">
                            <span class="icon">📋</span> Copy to Clipboard
                        </button>
                        <button id="clear-btn" class="btn secondary">
                            <span class="icon">↺</span> Reset
                        </button>
                    </div>
                </div>
                <div id="copy-message" class="toast">Copied!</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
